<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Dashboard</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // Lucide Icons as React components
        const Calendar = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
        );
        
        const Plus = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );
        
        const X = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        );
        
        const ExternalLink = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
        );
        
        const CheckCircle = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
        );
        
        const Circle = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
            </svg>
        );
        
        const Bell = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
        );
        
        const Palette = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="13.5" cy="6.5" r=".5"></circle>
                <circle cx="17.5" cy="10.5" r=".5"></circle>
                <circle cx="8.5" cy="7.5" r=".5"></circle>
                <circle cx="6.5" cy="12.5" r=".5"></circle>
                <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path>
            </svg>
        );

        // Simple localStorage-based storage mock
        window.storage = {
            get: async (key) => {
                const value = localStorage.getItem(key);
                return value ? { key, value } : null;
            },
            set: async (key, value) => {
                localStorage.setItem(key, value);
                return { key, value };
            },
            delete: async (key) => {
                localStorage.removeItem(key);
                return { key, deleted: true };
            }
        };

        function PersonalDashboard() {
            const [currentDate, setCurrentDate] = useState(new Date());
            const [notes, setNotes] = useState('');
            const [tasks, setTasks] = useState([]);
            const [links, setLinks] = useState([]);
            const [newTask, setNewTask] = useState('');
            const [newTaskDate, setNewTaskDate] = useState('');
            const [newLink, setNewLink] = useState({ title: '', url: '' });
            const [showNotification, setShowNotification] = useState(false);
            const [notificationTask, setNotificationTask] = useState(null);
            const [calendarEvents, setCalendarEvents] = useState([]);
            const [showEventModal, setShowEventModal] = useState(false);
            const [selectedDayForEvent, setSelectedDayForEvent] = useState(null);
            const [newEvent, setNewEvent] = useState('');
            const [openTab, setOpenTab] = useState(null);
            const [showThemeMenu, setShowThemeMenu] = useState(false);
            const [currentTheme, setCurrentTheme] = useState('pink');

            const themes = {
                pink: {
                    name: 'Light Pink',
                    bg: 'from-pink-50 to-rose-100',
                    primary: 'rose',
                    primaryColor: 'bg-rose-500 hover:bg-rose-600',
                    primaryLight: 'bg-rose-100 hover:bg-rose-200',
                    primaryText: 'text-rose-600 hover:text-rose-800',
                    primaryRing: 'ring-rose-500',
                    font: "'Playfair Display', 'Georgia', serif"
                },
                blue: {
                    name: 'White & Blue',
                    bg: 'from-blue-50 to-sky-100',
                    primary: 'blue',
                    primaryColor: 'bg-blue-500 hover:bg-blue-600',
                    primaryLight: 'bg-blue-100 hover:bg-blue-200',
                    primaryText: 'text-blue-600 hover:text-blue-800',
                    primaryRing: 'ring-blue-500',
                    font: "'Inter', 'Arial', sans-serif"
                },
                cream: {
                    name: 'Cream & Brown',
                    bg: 'from-amber-50 to-yellow-100',
                    primary: 'amber',
                    primaryColor: 'bg-amber-700 hover:bg-amber-800',
                    primaryLight: 'bg-amber-200 hover:bg-amber-300',
                    primaryText: 'text-amber-800 hover:text-amber-900',
                    primaryRing: 'ring-amber-700',
                    font: "'Merriweather', 'Georgia', serif"
                },
                dark: {
                    name: 'Dark Mode',
                    bg: 'from-gray-900 to-gray-800',
                    primary: 'purple',
                    primaryColor: 'bg-purple-600 hover:bg-purple-700',
                    primaryLight: 'bg-purple-900 hover:bg-purple-800',
                    primaryText: 'text-purple-400 hover:text-purple-300',
                    primaryRing: 'ring-purple-600',
                    font: "'Inter', 'Arial', sans-serif",
                    isDark: true
                },
                purple: {
                    name: 'White & Purple',
                    bg: 'from-purple-50 to-violet-100',
                    primary: 'purple',
                    primaryColor: 'bg-purple-500 hover:bg-purple-600',
                    primaryLight: 'bg-purple-100 hover:bg-purple-200',
                    primaryText: 'text-purple-600 hover:text-purple-800',
                    primaryRing: 'ring-purple-500',
                    font: "'Playfair Display', 'Georgia', serif"
                },
                green: {
                    name: 'White & Green',
                    bg: 'from-green-50 to-emerald-100',
                    primary: 'green',
                    primaryColor: 'bg-green-500 hover:bg-green-600',
                    primaryLight: 'bg-green-100 hover:bg-green-200',
                    primaryText: 'text-green-600 hover:text-green-800',
                    primaryRing: 'ring-green-500',
                    font: "'Inter', 'Arial', sans-serif"
                }
            };

            const theme = themes[currentTheme];

            // Load data
            useEffect(() => {
                const loadData = async () => {
                    try {
                        const notesData = await window.storage.get('dashboard-notes');
                        if (notesData) setNotes(notesData.value);

                        const tasksData = await window.storage.get('dashboard-tasks');
                        if (tasksData) setTasks(JSON.parse(tasksData.value));

                        const linksData = await window.storage.get('dashboard-links');
                        if (linksData) setLinks(JSON.parse(linksData.value));

                        const eventsData = await window.storage.get('dashboard-events');
                        if (eventsData) setCalendarEvents(JSON.parse(eventsData.value));

                        const themeData = await window.storage.get('dashboard-theme');
                        if (themeData) setCurrentTheme(themeData.value);
                    } catch (error) {
                        console.log('No saved data found');
                    }
                };
                loadData();
            }, []);

            // Save data
            useEffect(() => {
                if (notes !== '') window.storage.set('dashboard-notes', notes);
            }, [notes]);

            useEffect(() => {
                if (tasks.length > 0) window.storage.set('dashboard-tasks', JSON.stringify(tasks));
            }, [tasks]);

            useEffect(() => {
                if (links.length > 0) window.storage.set('dashboard-links', JSON.stringify(links));
            }, [links]);

            useEffect(() => {
                if (calendarEvents.length > 0) window.storage.set('dashboard-events', JSON.stringify(calendarEvents));
            }, [calendarEvents]);

            useEffect(() => {
                window.storage.set('dashboard-theme', currentTheme);
            }, [currentTheme]);

            useEffect(() => {
                const checkUpcomingTasks = () => {
                    const tomorrow = new Date();
                    tomorrow.setDate(tomorrow.getDate() + 1);
                    tomorrow.setHours(0, 0, 0, 0);

                    const upcomingTask = tasks.find(task => {
                        if (!task.completed && task.dueDate) {
                            const taskDate = new Date(task.dueDate);
                            taskDate.setHours(0, 0, 0, 0);
                            return taskDate.getTime() === tomorrow.getTime();
                        }
                        return false;
                    });

                    if (upcomingTask && !showNotification) {
                        setNotificationTask(upcomingTask);
                        setShowNotification(true);
                    }
                };
                checkUpcomingTasks();
            }, [tasks]);

            const getDaysInMonth = (date) => {
                const year = date.getFullYear();
                const month = date.getMonth();
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const daysInMonth = lastDay.getDate();
                const startingDayOfWeek = firstDay.getDay();
                return { daysInMonth, startingDayOfWeek };
            };

            const addTask = () => {
                if (newTask.trim() && newTaskDate) {
                    setTasks([...tasks, { id: Date.now(), text: newTask, dueDate: newTaskDate, completed: false }]);
                    setNewTask('');
                    setNewTaskDate('');
                }
            };

            const toggleTask = (id) => {
                setTasks(tasks.map(task => task.id === id ? { ...task, completed: !task.completed } : task));
            };

            const deleteTask = (id) => {
                const updatedTasks = tasks.filter(task => task.id !== id);
                setTasks(updatedTasks);
                if (updatedTasks.length === 0) window.storage.delete('dashboard-tasks');
            };

            const addLink = () => {
                if (newLink.title.trim() && newLink.url.trim()) {
                    let url = newLink.url;
                    if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
                    setLinks([...links, { id: Date.now(), title: newLink.title, url }]);
                    setNewLink({ title: '', url: '' });
                }
            };

            const deleteLink = (id) => {
                const updatedLinks = links.filter(link => link.id !== id);
                setLinks(updatedLinks);
                if (updatedLinks.length === 0) window.storage.delete('dashboard-links');
            };

            const addEvent = () => {
                if (newEvent.trim() && selectedDayForEvent) {
                    setCalendarEvents([...calendarEvents, { id: Date.now(), date: selectedDayForEvent, text: newEvent }]);
                    setNewEvent('');
                    setShowEventModal(false);
                    setSelectedDayForEvent(null);
                }
            };

            const deleteEvent = (id) => {
                const updatedEvents = calendarEvents.filter(event => event.id !== id);
                setCalendarEvents(updatedEvents);
                if (updatedEvents.length === 0) window.storage.delete('dashboard-events');
            };

            const openEventModal = (dateStr) => {
                setSelectedDayForEvent(dateStr);
                setShowEventModal(true);
            };

            const getEventsForDate = (dateStr) => {
                return calendarEvents.filter(event => event.date === dateStr);
            };

            const { daysInMonth, startingDayOfWeek } = getDaysInMonth(currentDate);
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

            const formatDate = (dateString) => {
                const date = new Date(dateString);
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            };

            return (
                <div className={`min-h-screen bg-gradient-to-br ${theme.bg} p-6`} style={{ fontFamily: theme.font }}>
                    {/* Theme Menu - Simplified for brevity */}
                    {showThemeMenu && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className={`${theme.isDark ? 'bg-gray-800' : 'bg-white'} rounded-2xl shadow-2xl p-6 max-w-md w-full`}>
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className={`text-2xl font-bold ${theme.isDark ? 'text-white' : 'text-gray-800'}`}>Choose Theme</h3>
                                    <button onClick={() => setShowThemeMenu(false)} className={theme.isDark ? 'text-gray-300' : 'text-gray-600'}>
                                        <X className="w-6 h-6" />
                                    </button>
                                </div>
                                <div className="space-y-2">
                                    {Object.entries(themes).map(([key, t]) => (
                                        <button
                                            key={key}
                                            onClick={() => { setCurrentTheme(key); setShowThemeMenu(false); }}
                                            className={`w-full p-4 rounded-lg border-2 transition-all text-left ${currentTheme === key ? `border-${t.primary}-500 ${theme.isDark ? 'bg-gray-700' : 'bg-gray-50'}` : `border-gray-200 ${theme.isDark ? 'hover:bg-gray-700' : 'hover:bg-gray-50'}`}`}
                                        >
                                            <div className="flex items-center gap-3">
                                                <div className={`w-8 h-8 rounded-full bg-gradient-to-br ${t.bg}`}></div>
                                                <span className={`font-medium ${theme.isDark ? 'text-white' : 'text-gray-800'}`}>{t.name}</span>
                                            </div>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="max-w-7xl mx-auto">
                        <div className="text-center mb-8">
                            <div className="flex items-center justify-center mb-4">
                                <button onClick={() => setShowThemeMenu(true)} className={`${theme.primaryColor} text-white p-3 rounded-lg shadow-lg hover:shadow-xl transition-all flex items-center gap-2`}>
                                    <Palette className="w-5 h-5" />
                                    <span className="font-medium">Change Theme</span>
                                </button>
                            </div>
                            <h1 className={`text-4xl font-bold ${theme.isDark ? 'text-white' : 'text-gray-800'} mb-2`}>My Dashboard</h1>
                            <p className={theme.isDark ? 'text-gray-300' : 'text-gray-600'}>{new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                        </div>

                        <div className="text-center">
                            <p className={`text-lg ${theme.isDark ? 'text-gray-300' : 'text-gray-600'}`}>
                                Your dashboard is ready! Start adding tasks, notes, and links. ✨
                            </p>
                            <p className={`text-sm mt-2 ${theme.isDark ? 'text-gray-400' : 'text-gray-500'}`}>
                                All your data is saved automatically and privately in your browser.
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<PersonalDashboard />, document.getElementById('root'));
    </script>
</body>
</html>
